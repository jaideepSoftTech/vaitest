# .github/workflows/pr.yml
#
# Week 2 scope: verify (from M0), plus `integration` and `security` jobs.
# The M0 exit criterion (05-ROADMAP-18-WEEKS.md) was just "CI green on an
# empty PR"; this adds the Week 2 contract gates.
#
# Deliberately NOT included yet:
#   - `isolation` (cross-tenant isolation harness) — Wk 2-3, harness doesn't exist yet
#   - `contract` (OpenAPI drift) — needs packages/types/openapi.json (Week 3)
#   - `images` (container build + trivy scan) — needs infrastructure/docker/Dockerfile
# These will be added when their dependencies land per the roadmap; adding jobs
# that reference nonexistent files makes CI permanently red, which is worse than
# not having them.
#
# Also dropped: the `pnpm qa lint:tenancy` step (a bespoke CLI check for literal
# bucket keys / unscoped redis keys / console.log — no `qa` CLI exists yet).
# The one piece of tenancy lint that *does* exist — the ESLint
# `no-bare-prisma-client` rule in packages/config — already runs as part of
# `pnpm turbo run lint` below.

name: PR

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Environment contract
        run: pnpm env:check # .env.example vs process.env references

      - name: Lint, typecheck, unit tests, build
        run: >
          pnpm turbo run lint typecheck test:unit build
          --cache-dir=.turbo
          --filter=...[origin/${{ github.base_ref }}]

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: coverage, path: "**/coverage/", retention-days: 7 }

  integration:
    name: "integration (ephemeral postgres + redis + minio)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: qa_test
        options: >-
          --health-cmd "pg_isready -U qa -d qa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports: ["6379:6379"]
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: miniotest
          MINIO_ROOT_PASSWORD: miniotest123
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm --filter @qa/db exec prisma migrate deploy --schema=../../database/schema.prisma
        env:
          DATABASE_URL: postgresql://qa:qa@localhost:5432/qa_test

      - name: Integration tests
        run: pnpm turbo run test:integration --cache-dir=.turbo
        env:
          DATABASE_URL: postgresql://qa:qa@localhost:5432/qa_test
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: miniotest
          S3_SECRET_KEY: miniotest123
          QA_REGION: us

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
        # NOTE: Audit findings are surfaced but do not fail the job in Week 2.
        # Dependency security is important, but triaging false positives in a
        # scaffold with no real traffic/secrets is not valuable at M0. This will
        # become a hard gate in a later week once the scaffold is stable.
